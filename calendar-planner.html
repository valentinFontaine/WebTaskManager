<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificateur Calendrier</title>
    
    <!-- Toast UI Calendar CSS - The order is important ! -->
    <link rel="stylesheet" href="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.css" />
    <link rel="stylesheet" href="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.css" />
    <link rel="stylesheet" href="https://uicdn.toast.com/calendar/v2.1.3/toastui-calendar.min.css" />
    
    <!-- Custom CSS -->
    <script src="nav.js"></script>
    <link rel="stylesheet" href="calendar-planner.css">
    <link rel="stylesheet" href="task-card-styles.css">
    <link rel="stylesheet" href="task-editor-styles.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght=300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Task Editor Modal (will be created dynamically) -->
    <div id="task-editor-modal"></div>
    <div class="app-container">
        <header class="app-header">
            <h1>📅 Planificateur Calendrier</h1>
            <div class="header-actions">
                <button id="today-btn" class="btn btn-primary">
                    <span class="icon">📍</span>
                    Aujourd'hui
                </button>
                <button id="refresh-btn" class="btn btn-secondary">
                    <span class="icon">🔄</span>
                    Actualiser
                </button>
            </div>
        </header>

        <div class="main-content">
            <!-- Colonne de gauche : Calendrier (70%) -->
            <div class="calendar-column">
                <div class="calendar-header">
                    <button id="prev-btn" class="nav-btn">
                        <span class="icon">◀</span>
                    </button>
                    <div class="calendar-title">
                        <h2 id="calendar-title">Calendrier</h2>
                        <div class="view-controls">
                            <button class="view-btn active" data-view="week">Semaine</button>
                            <button class="view-btn" data-view="day">Jour</button>
                            <button class="view-btn" data-view="month">Mois</button>
                        </div>
                    </div>
                    <button id="next-btn" class="nav-btn">
                        <span class="icon">▶</span>
                    </button>
                </div>
                <div id="calendar" class="calendar-container"></div>
            </div>

            <!-- Colonne de droite : Tâches non planifiées (30%) -->
            <div class="tasks-column">
                <div class="tasks-header">
                    <h2>Tâches à planifier</h2>
                    <div class="tasks-stats">
                        <span id="task-count" class="stat-badge">0 tâches</span>
                        <button id="add-task-btn" class="btn btn-success header-add-btn">
                            <span class="icon">➕</span>
                        </button>
                    </div>
                </div>
                
                <div class="tasks-filters">
                    <select id="sort-tasks" class="filter-select">
                        <option value="urgency">Par urgence</option>
                        <option value="due">Par échéance</option>
                        <option value="duration">Par durée</option>
                    </select>
                    <label class="filter-toggle" for="filter-ready-only"
                           title="Masquer les tâches dont la durée estimée n'est pas renseignée">
                        <input type="checkbox" id="filter-ready-only" checked>
                        Prêtes seulement
                    </label>
                    <label class="filter-toggle" for="filter-hors-filtre"
                           title="Afficher les créneaux déjà pris qui sortent du filtre courant">
                        <input type="checkbox" id="filter-hors-filtre" checked>
                        Blocs hors filtre
                    </label>
                </div>
                
                <div class="tasks-container" id="unplanned-tasks">
                    <div class="loading-message">
                        <span class="icon">⏳</span>
                        Chargement des tâches...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal pour les détails de tâche -->
    <div id="task-detail-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-task-title">Détails de la tâche</h3>
                <button class="modal-close" id="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body" id="modal-task-body">
                <!-- Contenu dynamique -->
            </div>
            <div class="modal-footer">
                <button id="modal-unschedule-btn" class="btn btn-warning">Déplanifier</button>
                <button id="modal-done-btn" class="btn btn-success">Terminer</button>
                <button id="modal-cancel-btn" class="btn btn-secondary">Fermer</button>
            </div>
        </div>
    </div>

    <!-- Toast UI Calendar JS - The order is important-->
    <script src="https://uicdn.toast.com/tui.time-picker/latest/tui-time-picker.js"></script>
    <script src="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.js"></script>
    <script src="https://uicdn.toast.com/calendar/v2.1.3/toastui-calendar.min.js"></script>
    <!-- Custom JS -->
    <script src="task-card.js"></script>
    <script src="task-editor.js"></script>
    <script src="calendar-planner.js"></script>
    <script>
        // Initialiser taskEditor pour calendar-planner
        document.addEventListener('DOMContentLoaded', () => {
            taskEditor = new TaskEditor({
                showAllFields: true,
                language: 'fr',
                onSaveSuccess: (task, isEdit) => {
                    console.log('Task saved successfully:', task);
                    if (isEdit) {
                        // Si c'est une édition, recharger toutes les tâches
                        loadTasks();
                    } else {
                        // Si c'est une nouvelle tâche, l'ajouter en haut de la liste
                        unplannedTasks.unshift(task);
                        displayUnplannedTasks(unplannedTasks);
                        updateTaskCount();
                    }
                },
                onSaveError: (error) => {
                    console.error('Error saving task:', error);
                    alert('Erreur lors de la sauvegarde: ' + error);
                }
            });
        });
    </script>

    <!-- Templates de cartes, injectes par le serveur : evite un fetch
         et la course qu'il ouvrait avec le premier rendu. -->
    <!-- task-card-templates -->
</body>
</html>
